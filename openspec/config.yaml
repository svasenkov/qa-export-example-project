schema: spec-driven

context: |
  Учебный QA-проект. Пиши артефакты на русском языке.
  Модули, стеки и доступ определяет docs/coverage-profile.md.
  Команды запуска бери из README соответствующего модуля.
  Текущие требования: openspec/specs/. HTTP-контракт: docs/api/openapi.yaml.
  Правила доказательств и покрытия: docs/qa/testing.md.
  Процедуры работы с тестами: skills/. Порядок изменения требований: openspec/README.md.
  agents/ зарезервирован для определений агентов; eval/ — для оценки их работы.
  Наличие этих каталогов не означает наличие запускаемых агентов или оценок.
  Отделяй исходные требования от предложений агента и наблюдений за реализацией.
  Не изменяй требования ради прохождения тестов. Сохраняй пользовательские изменения.
  Наличие сценария, теста или отметки в tasks.md не подтверждает успешный прогон.

rules:
  proposal:
    - Укажи источник требования и границы изменения; предложения агента помечай явно.
    - Не добавляй новую capability для чисто технического изменения существующей реализации.
  specs:
    - Описывай наблюдаемое поведение, существенные отрицательные и граничные сценарии.
    - Сохраняй идентификаторы требований и сценариев при изменении их содержания.
    - В MODIFIED переноси требование целиком со всеми сценариями, а не только изменённые строки.
    - Детали реализации и результаты прогонов храни отдельно; не копируй HTTP-схемы из OpenAPI.
  design:
    - Укажи затронутые модули и способ проверки; учитывай docs/coverage-profile.md.
    - Для agents/ и eval/ отделяй инструкции агента, входные задания и критерии оценки.
  tasks:
    - Для каждой задачи укажи способ проверки завершения.
    - Сохраняй команду, версию кода, стенд, результат и путь к артефактам выполненной проверки.
    - Архивацию указывай отдельным последующим действием без checkbox; не объявляй её проверкой продукта.
