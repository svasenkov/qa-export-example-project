# Defaults for local / CI override via -Dsonar.projectKey / SONAR_PROJECT_KEY.
sonar.projectKey=autotests-ai-multistack-app-frontend-typescript-vue
sonar.projectName=autotests-ai-multistack-app-frontend-typescript-vue
sonar.sources=src,vendor/ds/js/app-base.js
sonar.tests=src/test
sonar.test.inclusions=src/test/**/*
sonar.exclusions=src/test/**,**/*.d.ts
# i18n dictionaries mirror the same Dictionary key set per language by contract;
# key-parity is asserted by tests, so line-level CPD between locales is not signal.
sonar.cpd.exclusions=src/i18n/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json
sonar.qualitygate.wait=true
