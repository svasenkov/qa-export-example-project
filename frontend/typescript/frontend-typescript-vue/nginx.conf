# Static SPA at document root.
# Prod: host nginx strips /{backend}/{frontend}.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/backend-[^/]+/frontend-[^/]+(/.*)$ {
        rewrite ^/backend-[^/]+/frontend-[^/]+(/.*)$ $1 last;
    }

    # Never SPA-fallback real assets (else missing file → text/html MIME in console).
    location ~* \.(?:css|js|mjs|map|png|svg|ico|webmanifest|json|woff2?)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
