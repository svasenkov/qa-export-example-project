# Reuse the configuration phase locally and in CI. CI also supplies a stable
# encryption key and persists .gradle/configuration-cache in each Gradle job.
org.gradle.configuration-cache=true
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.max.interval=3000
