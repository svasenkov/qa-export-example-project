# stage — deployed stage of this cell (stage.autotests.ai/stack/<backend>/<frontend>).
# ./gradlew test -Denv=stage -DincludeTags=api
# ./gradlew test -Denv=stage -DincludeTags=e2e -DexcludeTags=screenshot
# SCREENSHOT_BROWSER=chrome ./gradlew test -Denv=stage -DincludeTags=screenshot
#
# Full debug run (video + VNC + all attachments):
#   -DenableVideo=true -DenableVnc=true -DattachVideo=true -DattachLastScreenshot=true \
#   -DattachPageSource=true -DattachBrowserConsoleLogs=true -DenableAllureSelenideListener=true

# REST Assured → Allure HTML (ApiTestBase only; e2e TestBase does not apply)
enableAllureRestAssuredListener=true
allureRestAssuredListenerStyle=colored

# Target app
baseUrl=https://stage.autotests.ai/stack/backend-go-stdlib/frontend-typescript-vue

# REST API — origin only; tests and pages ask for /api/... themselves
apiBaseUrl=https://stage.autotests.ai/stack/backend-go-stdlib/

# Browser configuration — Selenoid image tag (hub default 152.0; 151 + compat 148 still in catalog)
browserVersion=148.0
browserSize=1740x1080
headless=true

# Remote browser hub configuration (Selenide remoteUrl / selenoid:options).
# Credentials are NOT committed: pass the full URL per run / from the CI secret
# SELENOID_WEBDRIVER_URL, e.g. -DremoteUrl=https://<user>:<password>@selenoid.qa.guru/wd/hub
remoteUrl=https://selenoid.qa.guru/wd/hub
videoFolder=https://selenoid.qa.guru/video/

# Console log
logToConsole=false
selenideLogToConsole=false
rootLogLevel=warn
