# ci — the compose stack on this machine (the env name comes from the upstream CI
# lane; no workflow is emitted in this assembly).
# ./gradlew test -Denv=ci -DincludeTags=infra
# ./gradlew test -Denv=ci -DincludeTags=api
# ./gradlew test -Denv=ci -DincludeTags=e2e -DexcludeTags=screenshot
# Go+PG integration lives in backend/go/backend-go-stdlib: TEST_DATABASE_URL=… go test ./...
#
# Prerequisite: docker compose up -d (starts stand-gateway-ci too).
# UI + /api same-origin via stand-gateway-ci :9821 — the frontend container itself (:9813)
# is a static SPA with no /api route; the gateway mirrors the prod path shape.
# Watch a run locally: -Dheadless=false   HAR in Allure: -DenableHar=true -DattachHarLogs=true

# REST Assured → Allure HTML (ApiTestBase only; e2e TestBase does not apply)
enableAllureRestAssuredListener=true
allureRestAssuredListenerStyle=colored

# Target app — ci gateway (SPA at /, real backend at /api)
baseUrl=http://localhost:9821

# REST API — direct backend origin; tests append /api/... themselves
apiBaseUrl=http://localhost:8831/

# Browser configuration — local Chrome, no hub
browserSize=1920x1280
headless=true
