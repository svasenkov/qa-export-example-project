# Runtime defaults — values match @DefaultValue in TestConfig.java (Owner merge, lowest priority).
# Env profiles (config/${env}.properties) override only "where we point": baseUrl, apiBaseUrl, remoteUrl.
# Everything else is a per-run switch: -D<key>=<value> wins over both files.

# Allure report
allureReportMode=allure3
allureAgentMode=none

# Allow attachments after each test
attachBrowserConsoleLogs=false
attachHarLogs=false
attachLastScreenshot=false
attachPageSource=false
attachVideo=false
# Allow allure steps listener
enableAllureSelenideListener=false
# Allow REST Assured → Allure HTTP attachments
enableAllureRestAssuredListener=false
# default = stock jar templates; colored = tpl/request.ftl + tpl/response.ftl
allureRestAssuredListenerStyle=default

# Target app (Selenide e2e — HTTP stand, no trailing slash)
baseUrl=

# REST API (@Layer api — Rest Assured; empty → fail fast)
apiBaseUrl=
# Expected "service" in GET /api/health — equals the backend module id under test.
# Override when apiBaseUrl points at another backend: -DapiHealthService=backend-python-flask
apiHealthService=backend-go-stdlib
# Home welcome panel after seed login (WelcomePanel screenshot). Mock overrides to mock-user.
welcomeUsername=user1

# Browser configuration
browser=chrome
# Selenoid image tag when remoteUrl is set. Locally the exact build comes from
# chrome-for-testing.properties, and only the major here has to match it.
browserVersion=148
browserSize=1920x1280
headless=false
closeBrowserAfterEach=true
closeBrowserAfterAll=true
skipBlankOpen=false

# Client-side HAR via Chrome CDP (not a Selenoid hub capability)
enableHar=false

# Remote browser hub (Selenide remoteUrl / selenoid:options)
enableVnc=false
enableVideo=false
remoteUrl=
videoFolder=

# Screenshot tests (@Tag screenshot)
updateScreenshots=false
screenshotsDir=screenshots
screenshotDiffThreshold=0.015

# Console log
logToConsole=true
selenideLogToConsole=true
rootLogLevel=info
