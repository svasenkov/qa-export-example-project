# mock — compose mock profile (stand-gateway :9911, WireMock upstream).
# Prerequisite: docker compose --profile mock up -d stand-gateway
# ./gradlew test -Denv=mock -DincludeTags=ui
# SCREENSHOT_BROWSER=chrome ./gradlew test -Denv=mock -DincludeTags=screenshot
#
# Same-origin UI + /api/ via stand-gateway — no Selenoid, no prod deploy.
# Watch a run locally: -Dheadless=false

# Target app — gateway serves SPA at / and stubs /api/
baseUrl=http://localhost:9911

# REST API — same origin as baseUrl; tests/pages append /api/... themselves
apiBaseUrl=http://localhost:9911/

# WireMock /me stubs this name; login form still uses seed creds user1/password1
welcomeUsername=mock-user

# Browser configuration — local Chrome, no hub
browserSize=1920x1280
headless=true
