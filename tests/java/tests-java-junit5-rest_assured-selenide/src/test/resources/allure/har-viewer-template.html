<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HAR Viewer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1e1e1e;
      --panel: #1a1917;
      --border: #3d444c;
      --text: #cccccc;
      --muted: #999999;
      --accent: #6cb6ff;
      --ok: #89d185;
      --warn: #cca700;
      --err: #f48771;
      --redir: #6cb6ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: auto;
      min-height: 0;
      background: var(--bg);
      color: var(--text);
      font: 12px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: visible;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    .header h1 { margin: 0; font-size: 14px; font-weight: 600; }
    .summary { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .toolbar { display: flex; align-items: center; gap: 12px; font-size: 11px; }
    .toolbar .note { color: var(--muted); }
    .har-viewer { width: 100%; }
    .har-table-wrap { overflow: auto; }
    .har-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      line-height: 1.35;
      color: var(--text);
    }
    .har-table th, .har-table td {
      padding: 4px 8px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }
    .har-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--panel);
      color: var(--muted);
      font-weight: 600;
    }
    .har-method { font-weight: 600; color: var(--ok); }
    .har-url {
      max-width: 0;
      width: 50%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .har-mime { color: var(--muted); max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
    .har-status--ok { color: var(--ok); }
    .har-status--redir { color: var(--redir); }
    .har-status--warn { color: var(--warn); }
    .har-status--err { color: var(--err); }
    .har-status--muted { color: var(--muted); }
    .har-detail { padding: 8px 12px 12px; }
    .har-row details > summary { list-style: none; }
    .har-row details > summary::-webkit-details-marker { display: none; }
    .har-section__title {
      margin: 8px 0 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .har-kv {
      display: grid;
      grid-template-columns: minmax(96px, 140px) 1fr;
      gap: 2px 12px;
      font-size: 12px;
      line-height: 1.4;
    }
    .har-kv__k { color: var(--muted); word-break: break-all; white-space: normal; }
    .har-kv__v { color: var(--text); word-break: break-word; overflow-wrap: anywhere; white-space: pre-wrap; }
    .har-muted { color: var(--muted); }
    .har-body {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 180px;
      overflow: auto;
    }
    .empty, .error { padding: 24px; text-align: center; }
    .empty { color: var(--muted); }
    .error { color: var(--err); }
  </style>
</head>
<body style="margin:0;height:auto;min-height:0;background:#1e1e1e;color:#ccc;font:12px/1.35 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:visible">
  <div class="header" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:8px 12px;border-bottom:1px solid #3d444c;background:#1a1917">
    <h1 style="margin:0;font-size:13px;font-weight:600">HAR Viewer</h1>
    <div class="summary" style="color:#999;font-size:11px;white-space:nowrap">__SUMMARY__</div>
    <div class="toolbar" style="display:flex;align-items:center;gap:12px;font-size:11px">
      <span class="note" style="color:#999">Raw: <code>capture.har</code></span>
    </div>
  </div>
  __CONTENT__
</body>
</html>
