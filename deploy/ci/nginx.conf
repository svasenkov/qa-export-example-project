# Local ci stand gateway — same-origin / + /api/ for the SPA at document root (port 9821).
# Mirrors the prod path shape (host nginx) with the REAL backend, so the full e2e flow
# (-Denv=ci -DincludeTags=e2e) runs on the compose stack. The mock twin lives
# in deploy/mock/nginx.conf (WireMock upstream).

server {
    listen 80;
    server_name _;

    # Docker embedded DNS, re-resolved per request. A static `upstream` block pins the container
    # IP at gateway startup, so every rebuild leaves this proxy answering 502 until the
    # gateway itself is recreated. Resolving through a variable keeps the stand usable.
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options nosniff always;

    location /api/ {
        set $backend_upstream "backend-go-stdlib:8080";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$backend_upstream;
    }

    location / {
        set $frontend_upstream "frontend-typescript-vue:80";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$frontend_upstream;
    }
}
