# Local mock stand gateway — same-origin / + /api/ for the SPA (port 9911).
# Twin of deploy/ci/nginx.conf with a WireMock upstream instead of the real backend,
# plus /__admin/ so MockScenarios can drive WireMock scenarios through the gateway.
# Prerequisite: docker compose --profile mock up -d stand-gateway
# Run: ./gradlew test -Denv=mock -DincludeTags=ui

server {
    listen 80;
    server_name _;

    # Docker embedded DNS, re-resolved per request (see deploy/ci/nginx.conf — a static
    # upstream pins a stale container IP after every rebuild).
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options nosniff always;

    # WireMock admin API — MockScenarios (GET/PUT scenarios, POST reset) via apiBaseUrl.
    location /__admin/ {
        set $mock_admin_upstream "api-mock:8080";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://$mock_admin_upstream;
    }

    location /api/ {
        set $mock_upstream "api-mock:8080";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$mock_upstream;
    }

    location / {
        set $frontend_upstream "frontend-typescript-vue:80";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$frontend_upstream;
    }
}
